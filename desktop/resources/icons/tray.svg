<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="GlobalShare">
  <!-- Source de l'icône du tray (repos). Régénérer tray.png avec :
       magick -background none tray.svg -filter Lanczos -resize 32x32 PNG32:tray.png
       Glyphe monochrome sur fond transparent, comme les icônes symboliques du
       panneau GNOME : pas de tuile colorée, qui ressemblait à une icône
       d'application parmi les indicateurs du shell.
       Le halo sombre très fin est invisible sur un panneau sombre ; il garde le
       glyphe lisible sur un panneau clair, que le shell ne recolore pas (les
       pixmaps SNI ne reçoivent pas le traitement « symbolic »). -->
  <path d="M144 256 L368 128 M144 256 L368 384" fill="none" stroke="#000000" stroke-opacity="0.55" stroke-width="76" stroke-linecap="round"/>
  <g fill="#FFFFFF" stroke="#000000" stroke-opacity="0.55" stroke-width="24" paint-order="stroke">
    <circle cx="144" cy="256" r="56"/>
    <circle cx="368" cy="128" r="56"/>
    <circle cx="368" cy="384" r="56"/>
  </g>
  <path d="M144 256 L368 128 M144 256 L368 384" fill="none" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round"/>
</svg>
