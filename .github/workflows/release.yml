name: Release desktop apps

# Le tag est la source de vérité de la version : pousser v1.2.0 produit les
# paquets rpm/deb/AppImage et l'installateur Windows, puis les publie dans la
# release GitHub que l'auto-update interroge.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la version à publier (ex. v1.2.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: 'desktop-release-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            target: --linux rpm deb AppImage
          - os: windows-latest
            name: windows
            target: --win nsis

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      # Le binaire Electron (~100 Mo) et les outils electron-builder sont
      # téléchargés par npm ci. Le cache évite de les reprendre à chaque tag.
      - name: Cache Electron downloads (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json', 'desktop/package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Cache Electron downloads (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json', 'desktop/package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install rpm tooling
        if: matrix.name == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends rpm gnupg

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix desktop ci --no-audit --no-fund

      - name: Sync version with tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/set-version.mjs

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Build static export
        run: npm run build:desktop
        env:
          # Mêmes valeurs que les défauts de scripts/build-desktop.mjs, rendues
          # explicites pour la lisibilité de la release.
          NEXT_PUBLIC_SOCKET_URL: https://global-share-socket.sitizstorm.workers.dev
          NEXT_PUBLIC_SHARE_BASE: https://stxtxm.github.io/global-share
          NEXT_PUBLIC_TURN_URLS: ${{ vars.TURN_URLS }}
          NEXT_PUBLIC_TURN_USERNAME: ${{ vars.TURN_USERNAME }}
          NEXT_PUBLIC_TURN_CREDENTIAL: ${{ vars.TURN_CREDENTIAL }}

      # Mise à jour delta : le bundle web (~1,4 Mo) et son manifeste sont
      # publiés avec les paquets. Les applications installées le téléchargent
      # à la place du paquet complet (~80 Mo) tant que nativeVersion est
      # inchangée (voir desktop/web-updates.js et docs/DESKTOP.md).
      # Produit une seule fois (job linux) : deux jobs l'uploadant en parallèle
      # pourraient laisser dans la release un zip qui ne correspond plus au
      # manifeste publié à côté.
      - name: Build web bundle
        if: matrix.name == 'linux'
        run: node scripts/web-bundle.mjs

      - name: Package
        run: npx --no-install electron-builder ${{ matrix.target }} --publish never

      # Depuis Fedora 45, rpm applique la vérification des signatures par
      # défaut : un paquet non signé est refusé (« n'est pas vérifié : pas de
      # signature »). La clé privée vient du secret du dépôt ; la partie
      # publique est versionnée dans desktop/resources/RPM-GPG-KEY-globalshare.
      - name: Sign rpm package
        if: matrix.name == 'linux'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::Secret GPG_PRIVATE_KEY manquant : un rpm non signé ne s'installe plus sur Fedora 45+."
            exit 1
          fi
          export GNUPGHOME="$(mktemp -d)"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ { print $5; exit }')"
          for package in dist/*.rpm; do
            rpmsign --addsign \
              --define "_gpg_name $KEY_ID" \
              --define "_gpg_path $GNUPGHOME" \
              "$package"
            # rpmsign modifie le fichier : electron-builder avait déjà calculé
            # le sha512 et la taille. Sans cette correction, l'auto-update
            # échoue avec « sha512 checksum mismatch ».
            node scripts/fix-release-checksum.mjs dist/latest-linux.yml "$(basename "$package")"
          done
          cp desktop/resources/RPM-GPG-KEY-globalshare dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.rpm
            dist/*.deb
            dist/*.AppImage
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
            dist/web-bundle.zip
            dist/web-bundle.json
            dist/RPM-GPG-KEY-globalshare

  publish:
    timeout-minutes: 10
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Le corps de la release est aussi le « patch notes » lu par l’APK
      # Android : on y met la section du CHANGELOG, sinon GitHub génère la
      # liste des changements (mise à jour rapide : notes déjà dans le bundle).
      - name: Extraire les notes de version
        run: node scripts/release-notes.mjs "${TAG#v}" > notes.md || rm -f notes.md

      - name: Publish GitHub release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          elif [ -s notes.md ]; then
            gh release create "$TAG" artifacts/* \
              --title "GlobalShare ${TAG#v}" \
              --notes-file notes.md
          else
            gh release create "$TAG" artifacts/* \
              --title "GlobalShare ${TAG#v}" \
              --generate-notes
          fi
