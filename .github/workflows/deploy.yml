name: Deploy to GitHub Pages

# Every push to main deploys. Merging a pull request into main produces such a
# push, so a PR merge is deployed automatically. Manual runs stay available from
# the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Déployé avant le site : un build Pages ne peut jamais pointer vers une
  # version du Worker plus ancienne que le dépôt.
  worker:
    runs-on: ubuntu-latest
    env:
      # Identifiant de compte Cloudflare (public, ce n'est pas un secret).
      CLOUDFLARE_ACCOUNT_ID: 0bf0ac08e2a32bb3b08436887d9df307
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # wrangler 4.156 exige Node >= 22 (le build Next.js reste sur Node 20).
          node-version: '22'

      - name: Require CLOUDFLARE_API_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN manquant (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - name: Deploy Cloudflare Worker
        working-directory: socket-server-cloudflare
        run: npx --yes wrangler@4.156.2 deploy --durable-objects-code-update-mode immediate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Le test unitaire exécute directement le TypeScript via le type
          # stripping natif, disponible à partir de Node 22.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          # Les tests ne lancent pas Electron : inutile de télécharger le binaire.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Unit tests
        run: npm run test:unit

  build:
    needs: [worker, test]
    # Un build Pages n'a besoin d'aucun nouveau Worker pour être publié. Sans
    # cette condition, une panne Cloudflare (jeton expiré, API indisponible)
    # bloquait aussi la publication du client. Le job worker reste rouge.
    if: always() && needs.worker.result != 'cancelled' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          # Le site statique n'a pas besoin du binaire Electron (voir release.yml).
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build Next.js app
        run: npm run build
        env:
          # Public URL of the Cloudflare Worker (see socket-server-cloudflare/).
          # This is not a secret: it is embedded in the browser bundle anyway.
          NEXT_PUBLIC_SOCKET_URL: https://global-share-socket.sitizstorm.workers.dev
          # Relais TURN facultatif (voir docs/DEPLOYMENT.md) : indispensable
          # derrière un NAT symétrique, où la connexion directe échoue. Vides par
          # défaut, auquel cas seuls les STUN publics sont utilisés.
          NEXT_PUBLIC_TURN_URLS: ${{ vars.TURN_URLS }}
          NEXT_PUBLIC_TURN_USERNAME: ${{ vars.TURN_USERNAME }}
          NEXT_PUBLIC_TURN_CREDENTIAL: ${{ vars.TURN_CREDENTIAL }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
