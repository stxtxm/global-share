name: Deploy to GitHub Pages

# Every push to main deploys. A docs-only push does not: it cannot change the
# exported site, so it must not consume a runner or invalidate the live cache.
# Manual runs stay available from the Actions tab.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Worker, tests and build start together. `deploy` waits for all three, so a
  # successful Worker is still live before the site. If the Worker fails, the
  # deploy job still runs: a static client does not need a new Worker.
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Identifiant de compte Cloudflare (public, ce n'est pas un secret).
      CLOUDFLARE_ACCOUNT_ID: 0bf0ac08e2a32bb3b08436887d9df307
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # wrangler 4.156 exige Node >= 22 (le build Next.js reste sur Node 20).
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: socket-server-cloudflare/package-lock.json

      - name: Require CLOUDFLARE_API_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN manquant (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      # npm ci réutilise le cache du lockfile et évite le téléchargement npx
      # aléatoire de wrangler à chaque déploiement.
      - name: Install Worker dependencies
        working-directory: socket-server-cloudflare
        run: npm ci --no-audit --no-fund

      - name: Deploy Cloudflare Worker
        working-directory: socket-server-cloudflare
        run: npx --no-install wrangler deploy --durable-objects-code-update-mode immediate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Le test unitaire exécute directement le TypeScript via le type
          # stripping natif, disponible à partir de Node 22.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          # Les tests ne lancent pas Electron : inutile de télécharger le binaire.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Unit tests
        run: npm run test:unit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

  build:
    # Pas de `needs` : le build démarre avec le Worker et les tests. La
    # publication reste conditionnée par leur succès dans le job `deploy`.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          # Le site statique n'a pas besoin du binaire Electron (voir release.yml).
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Build Next.js app
        run: npm run build
        env:
          # Public URL of the Cloudflare Worker (see socket-server-cloudflare/).
          # This is not a secret: it is embedded in the browser bundle anyway.
          NEXT_PUBLIC_SOCKET_URL: https://global-share-socket.sitizstorm.workers.dev
          # Relais TURN facultatif (voir docs/DEPLOYMENT.md) : indispensable
          # derrière un NAT symétrique, où la connexion directe échoue. Vides par
          # défaut, auquel cas seuls les STUN publics sont utilisés.
          NEXT_PUBLIC_TURN_URLS: ${{ vars.TURN_URLS }}
          NEXT_PUBLIC_TURN_USERNAME: ${{ vars.TURN_USERNAME }}
          NEXT_PUBLIC_TURN_CREDENTIAL: ${{ vars.TURN_CREDENTIAL }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, test, worker]
    # Un échec Cloudflare ne doit pas empêcher la publication du client
    # statique. En revanche, on attend la fin du Worker pour que le site ne
    # pointe jamais vers une version plus ancienne du Worker.
    if: >-
      always()
      && needs.build.result == 'success'
      && needs.test.result == 'success'
      && needs.worker.result != 'cancelled'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
